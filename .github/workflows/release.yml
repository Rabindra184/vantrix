# Tag-driven releases for the Vantrix Gradle plugin (clients/gatling-gradle).
#
# Pushing a tag `v<semver>` builds the full 42-test suite, publishes
# dev.vantrix:gatling-gradle-plugin:<semver> to GitHub Packages, and creates a
# GitHub Release — so a real version is a deliberate act, while main's own CI
# keeps republishing 0.1.0-SNAPSHOT on every push for the bleeding edge.
#
# The version reaches Gradle through -PreleaseVersion (see the comment on
# `version` in clients/gatling-gradle/build.gradle.kts for why it is a named
# property rather than -Pversion).
name: release-plugin
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      packages: write   # the versioned publish
    defaults:
      run:
        working-directory: clients/gatling-gradle
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test at the release version
        run: ./gradlew build --no-daemon -PreleaseVersion="${GITHUB_REF_NAME#v}"
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew publish --no-daemon -PreleaseVersion="${GITHUB_REF_NAME#v}"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "gatling-gradle-plugin ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            build/libs/gatling-gradle-plugin-"${GITHUB_REF_NAME#v}".jar

  # ═══ THE PLATFORM IMAGE ═══
  #
  # Before this job the only thing a `v*` tag produced was the Gradle plugin.
  # Anyone wanting to RUN PerfPortal had to clone the repository and build the
  # image themselves, which also meant every operator was building an
  # unversioned image from whatever `main` said that day — and, for a while,
  # an image that did not build at all (see infra/Dockerfile's own comments).
  #
  # linux/amd64 ONLY, deliberately. A multi-arch build would have to run the
  # whole `pnpm install && pnpm build` under QEMU for arm64, which takes tens
  # of minutes and is the kind of step that starts timing out rather than
  # failing cleanly. Add `linux/arm64` to `platforms` below when a native
  # arm64 runner is available; an amd64 image still runs on Apple Silicon
  # under emulation, which is the case that would have justified it.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cased because a GHCR repository path must be, and a GitHub
      # owner may not be — `docker push` fails with `invalid reference format`
      # on an owner with a capital letter, at the very end of a long build.
      - name: Resolve the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/perfportal" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══ VERSIONED AGENT BINARIES ═══
  #
  # `ci.yml` builds these too, but as a 90-day `actions/upload-artifact`
  # attached to a workflow run — which is a build artefact, not a download an
  # operator can point a load generator at. There was no released binary at
  # all; the documented install was "check out the repository and build Go".
  #
  # `needs: release` because that job is what creates the GitHub Release these
  # assets attach to.
  #
  # darwin as well as linux: the agent is usually deployed on a Linux load
  # generator, but the first thing anyone does is run it on their laptop to
  # see what it reports.
  agent:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # The same gate ci.yml runs. A tag is not a reason to skip it — it is
      # the one build whose output people keep.
      - run: go vet ./...
      - run: go test ./... -race
      - run: go test -run TestFootprintBudget -v ./...

      - name: Build every published target
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -o "dist/perfportal-agent-${os}-${arch}" ./cmd/perfportal-agent
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
