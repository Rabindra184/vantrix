name: ci

# ONE RUN PER COMMIT, NOT TWO.
#
# This used to be `on: [push, pull_request]`, which fires BOTH triggers for a
# branch that has a PR open — so every push ran the whole ~13-minute `build`
# job twice, on two separate VMs, against one SHA. That is not just double the
# minutes: each run is an independent chance to hit a flake, and ONE red run
# out of two is enough to make the PR's mergeStateStatus UNSTABLE and block
# the merge button. Observed on PR #56, where the `push` run passed and the
# `pull_request` run failed on a single 120s timeout in an unrelated test.
#
# A `concurrency` group CANNOT fix that on its own, which is worth knowing
# before reaching for one: on a `pull_request` event `github.ref` is
# `refs/pull/N/merge`, not the branch, so the push run and the PR run for the
# same commit land in different groups however the key is spelled. (Tried on
# PR #57; both jobs still ran.) Restricting `push` to the default branch is
# what actually removes the duplicate.
#
# The two triggers now cover disjoint things: `pull_request` proves a change
# before it lands, `push` proves `main` after it does. A branch with no PR
# open gets no run, which is the point — there is nothing to prove yet.
on:
  push:
    branches: [main]
  pull_request:
  # For `e2e-cross-browser`, which is deliberately not on every pull request
  # — see that job's own comment. Declared here so it can be asked for from
  # the Actions tab when a change really does touch layout or cookies.
  workflow_dispatch:

# Supersede, do not queue: a second push to a PR makes the first run's answer
# irrelevant. `github.run_id` on `main` instead, because each merge commit is
# a distinct thing to prove green and a cancelled one leaves no record that it
# was ever built.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.ref == 'refs/heads/main' && github.run_id || github.ref
    }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perfportal
          POSTGRES_PASSWORD: perfportal
          POSTGRES_DB: perfportal
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U perfportal"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

      minio:
        # bitnami/minio is used (not minio/minio, the local-compose image)
        # because GitHub Actions service containers cannot override a
        # container's command, and minio/minio's entrypoint requires an
        # explicit `server /data` argument to start; bitnami's image starts
        # the server automatically from MINIO_ROOT_USER/PASSWORD alone.
        #
        # The `bitnami/*` Docker Hub org stopped publishing free images in
        # its August 2025 catalog change; `bitnami/minio:latest` no longer
        # resolves. Existing free-tier tags moved to `bitnamilegacy/minio`,
        # verified locally to pull, boot without a command, and pass this
        # same health check.
        #
        # Pinned by digest, not `:latest`: `bitnamilegacy` is itself a
        # deprecated/archival namespace (the whole reason it exists is that
        # `bitnami/minio:latest` vanished out from under CI once already), so
        # a second floating tag from the same namespace would repeat the
        # exact exposure this comment is here to explain. Resolved with
        # `docker pull bitnamilegacy/minio:latest && docker inspect
        # --format='{{index .RepoDigests 0}}' bitnamilegacy/minio:latest`
        # on 2026-08-08; bump this digest deliberately, not automatically,
        # the next time the image needs to change.
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: perfportal
          MINIO_ROOT_PASSWORD: perfportal123
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://perfportal:perfportal@localhost:5433/perfportal
      REDIS_URL: redis://localhost:6380
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: perfportal
      S3_SECRET_KEY: perfportal123

    steps:
      - uses: actions/checkout@v4
      # No `version:` input: package.json's `packageManager` field pins it,
      # and pnpm/action-setup refuses both at once. One source of truth for
      # the pnpm the lockfile was written by — CI, the image and a
      # contributor's `corepack enable` all read the same field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # A dependency change is only validated from a clean install. The single
      # CI failure in this project's history was a removal verified against a
      # stale node_modules that still had the package hoisted.
      - run: pnpm install --frozen-lockfile

      # ═══ THE DEPENDENCY GATE ═══
      #
      # `--prod` and not a bare audit: this asks what a DEPLOYED instance is
      # exposed to, which is the question a release needs answered. It was
      # answered by nobody until a pre-release audit ran it by hand and found
      # 1 critical, 6 high and 7 moderate.
      #
      # It is a hard failure, not a warning. An advisory that cannot be
      # resolved by an upgrade or a `pnpm.overrides` entry (see package.json)
      # goes in `pnpm.auditConfig.ignoreGhsas` WITH a comment saying why it is
      # not reachable here and what would make it reachable — a decision
      # somebody wrote down, rather than a number nobody reads.
      #
      # Runs before the build so a red advisory reports in seconds rather than
      # behind the whole gate.
      - run: pnpm audit --prod

      - run: pnpm --filter @perfportal/persistence exec prisma generate --schema prisma/schema.prisma
      - run: pnpm --filter @perfportal/persistence exec prisma migrate deploy --schema prisma/schema.prisma

      - run: pnpm lint
      # BEFORE typecheck, not after. apps/web/e2e/fixtures.ts imports the
      # worker's COMPILED output (../../worker/dist/...) — deliberately, so
      # Playwright's TS loader never has to re-transpile a Nest-decorated
      # class; see the comment at the top of that file. So `apps/web/e2e`
      # cannot be type-checked until apps/worker has been built.
      #
      # This never fails on a developer's machine, because dist/ is already
      # there from the last build. It fails only on a clean checkout, which
      # is exactly what CI is.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration

      # Chromium only — playwright.config.ts declares one project.
      - run: pnpm exec playwright install --with-deps chromium
      # AFTER test:integration, never beside it: createTestApp() TRUNCATEs
      # every table, and these two suites share one database.
      - run: pnpm test:e2e

  # The load-generator telemetry agent (agent/) is a Go module outside the
  # pnpm workspace (pnpm-workspace.yaml globs only packages/* and apps/*), so
  # it gets its own job rather than a step bolted onto `build`. It needs no
  # Postgres, Redis or MinIO, so as its own job it runs in parallel and a Go
  # failure reports in under a minute instead of behind the whole Node gate.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4
      # `go-version-file: agent/go.mod` rather than a literal: the `go`
      # directive in that file is the single source of truth for the toolchain,
      # exactly as .nvmrc is for Node. A literal here drifts silently.
      #
      # That directive reads `go 1.24.0`, not the bare `go 1.24` Task 1
      # shipped — Task 3's `go get github.com/shirou/gopsutil/v4` pulled in
      # v4.26.7, which itself declares `go 1.24.0`, and a module's directive
      # must be at least its dependencies'. `go 1.24` is therefore not
      # restorable; `go mod tidy` rewrites it back every time. The version is
      # no longer ours to choose. The `toolchain` directive `go get` also
      # wanted to add is deliberately absent, though — that would pin CI to
      # whichever patch release happened to be installed on the developer's
      # laptop the day the dependency was added, and every other developer's
      # `go mod tidy` would either silently download that exact patch or
      # churn the file back and forth against their own local toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - run: go vet ./...
      # footprint_test.go carries a `//go:build !race` tag, so it is not even
      # compiled into this run — see that file for why.
      - run: go test ./... -race
      # WITHOUT -race. The detector multiplies CPU by 5-10x, so a budget
      # measured under it is measuring the detector; the build tag above is
      # what makes this the only step that ever runs it.
      - run: go test -run TestFootprintBudget -v ./...

      # Cross-compiled for the platforms load generators actually run on
      # (spec §9). linux/amd64 and linux/arm64 at minimum; CGO_ENABLED=0 so the
      # result is a single static binary with no glibc floor, which is what
      # makes "copy it onto the box" a real distribution story.
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/perfportal-agent-linux-amd64 ./cmd/perfportal-agent
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/perfportal-agent-linux-arm64 ./cmd/perfportal-agent
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: perfportal-agent
          path: agent/dist/

  # ═══ THE DEPLOYMENT ARTEFACT NOBODY WAS BUILDING ═══
  #
  # `infra/docker-compose.yml` and `infra/Dockerfile` are in NO `pnpm` gate —
  # `pnpm lint`, `pnpm typecheck` and every `pnpm test:*` are blind to both,
  # the same way they are blind to `agent/` and `clients/gatling-gradle/`. The
  # cost of that showed up all at once in a pre-release audit:
  #
  #  - `docker compose config` failed outright with nothing exported, because
  #    a `${VAR:?}` inside a service behind the `onprem` profile aborts
  #    interpolation for the WHOLE file — so the quick start in README.md
  #    could not start a single container.
  #  - the image had stopped building at two separate steps: Debian pruned
  #    openjdk-21 from bookworm-backports, and the Gatling bundle stopped
  #    shipping the `lib/` directory the runtime step went looking for.
  #
  # Neither was caused by a change in this repository. Both were caused by the
  # world moving underneath a file nothing ran. This job runs it.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ONLY the three variables both READMEs tell an operator to export, and
      # nothing else: that is exactly the condition the documented quick start
      # runs under, and the condition the interpolation regression above
      # reproduced under. `PERFPORTAL_RUNNER_ORG_ID` is deliberately absent.
      - name: docker compose config, base and onprem
        env:
          PERFPORTAL_DB_PASSWORD: ci-only
          PERFPORTAL_S3_ACCESS_KEY: ci-only
          PERFPORTAL_S3_SECRET_KEY: ci-only-secret
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml --profile onprem config --quiet

      # `config --quiet` only proves the file PARSES. The API and the runner
      # also have to agree about where an uploaded artifact lives: both default
      # RUNNER_ARTIFACT_DIR to a RELATIVE path, so a moved mount, a renamed
      # volume or a relative override all parse fine and then fail at runtime
      # as ARTIFACT_NOT_FOUND — which reads like a failed upload rather than
      # two services looking in different directories.
      - name: The API and the runner agree about the artifact directory
        env:
          PERFPORTAL_DB_PASSWORD: ci-only
          PERFPORTAL_S3_ACCESS_KEY: ci-only
          PERFPORTAL_S3_SECRET_KEY: ci-only-secret
        run: |
          node infra/test/runner-paths.mjs

          # And the check has to be able to FAIL, or it is a guess. The
          # override moves the runner's mount by one path segment — the exact
          # defect, in the shape that still parses.
          if node infra/test/runner-paths.mjs \
               -f infra/docker-compose.yml \
               -f infra/test/runner-paths-broken.yml > /dev/null 2>&1; then
            echo "runner-paths.mjs PASSED against the deliberately broken override"
            exit 1
          fi
          echo "the broken override is rejected, as it must be"

      # The whole image, not a cached prefix. Both breaks above were in RUN
      # steps that a layer cache would have skipped.
      - name: Build the production image
        run: docker build -f infra/Dockerfile -t perfportal:ci .

      # The two things the image is built to carry, checked by running them.
      # A `RUN ls` inside the Dockerfile proves the file exists; this proves
      # the runtime starts, which is the property the runner depends on.
      - name: The image carries a working Java 21 and a Gatling runtime
        run: |
          docker run --rm perfportal:ci java -version
          docker run --rm perfportal:ci sh -c 'ls "$RUNNER_GATLING_HOME"/lib/gatling-core-*.jar'
          docker run --rm perfportal:ci sh -c \
            'java --add-opens=java.base/java.lang=ALL-UNNAMED -cp "$RUNNER_GATLING_HOME/lib/*" io.gatling.app.Gatling 2>&1 | grep -q "Missing simulation class"'

      # A production container with no BETTER_AUTH_SECRET must die at startup
      # with a message naming the variable — not start, pass its health check,
      # and then fail every sign-in, which is what it did before
      # apps/api/src/config.ts grew its own check.
      - name: The API refuses to start in production with no auth secret
        run: |
          set +e
          out=$(docker run --rm -e DATABASE_URL=postgresql://u:p@nowhere:5432/db perfportal:ci 2>&1)
          status=$?
          set -e
          echo "$out"
          test "$status" -ne 0
          echo "$out" | grep -q "BETTER_AUTH_SECRET is required"

  # ═══ THE CLEANUP SCRIPT NOTHING ELSE RUNS ═══
  #
  # `infra/clean-test-residue.sql` deletes the orgs `pnpm test:e2e` leaves
  # behind. It is in no other gate — the same exposure the rest of `infra/`
  # had when all four things in it had rotted, and for the same reason. What
  # breaks this file is a MIGRATION, not an edit to it, so the check has to
  # run against a real migrated schema rather than lint the SQL.
  test-residue:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perfportal
          POSTGRES_PASSWORD: perfportal
          POSTGRES_DB: perfportal
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U perfportal"
          --health-interval 5s --health-timeout 5s --health-retries 20

      # Same image and digest as the `build` job, for the reasons spelled out
      # there: minio/minio needs a command a service container cannot give it,
      # and `bitnamilegacy` is an archival namespace that must stay pinned.
      minio:
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: perfportal
          MINIO_ROOT_PASSWORD: perfportal123
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://perfportal:perfportal@localhost:5433/perfportal
      PGPASSWORD: perfportal
      PSQL: psql -h localhost -p 5433 -U perfportal -d perfportal -v ON_ERROR_STOP=1
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: perfportal
      S3_SECRET_KEY: perfportal123

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @perfportal/persistence exec prisma migrate deploy --schema prisma/schema.prisma

      # DRIFT. The script names six FK-free tables by hand, and a migration
      # adding a seventh would leave its rows orphaned with nothing failing.
      # This asks the database which tables carrying `org_id` are NOT
      # reachable from `org` by a CASCADE chain — exactly the set that must be
      # deleted explicitly — and requires each to appear in the script.
      - name: The script names every table org does not cascade to
        run: |
          $PSQL -At -f infra/test/fk-free-tables.sql > /tmp/fk-free.txt
          echo "FK-free tables carrying org_id:"; cat /tmp/fk-free.txt
          test -s /tmp/fk-free.txt || { echo "::error::query returned nothing — it has stopped testing anything"; exit 1; }
          while read -r t; do
            grep -q "DELETE FROM $t " infra/clean-test-residue.sql || {
              echo "::error::$t carries org_id, is not reachable from org by CASCADE, and infra/clean-test-residue.sql does not delete from it"
              exit 1
            }
          done < /tmp/fk-free.txt

      # BEHAVIOUR. The half that matters most is the keeper: a pattern that
      # grew too broad passes every "residue is gone" assertion while
      # destroying real data.
      - name: It removes residue and leaves everything else alone
        run: |
          $PSQL -q -f infra/test/residue-seed.sql
          $PSQL -q -f infra/clean-test-residue.sql
          $PSQL -q -f infra/test/residue-assert.sql

      # RED-VERIFY. An assertion nobody has watched fail is a guess. This
      # reruns the same assertion against a script that orphans every FK-free
      # row, and fails the job if it passes.
      - name: ...and that assertion is not vacuous
        run: |
          $PSQL -q -c "TRUNCATE org CASCADE" -c "TRUNCATE run_stat, run_series_bucket"
          $PSQL -q -f infra/test/residue-seed.sql
          $PSQL -q -f infra/test/residue-broken.sql
          if $PSQL -q -f infra/test/residue-assert.sql 2>/dev/null; then
            echo "::error::residue-assert.sql passed against residue-broken.sql — it has stopped testing anything"
            exit 1
          fi
          echo "assertion correctly rejected the broken script"

      # THE OBJECT-STORE HALF. `packages/storage`'s integration tests leave a
      # `test-<uuid>` BUCKET behind apiece, and nothing has ever removed them:
      # `test:integration` truncates the database on setup and never touches
      # S3. Measured 2026-09-12 on a dev machine: 8 stale buckets holding
      # 4,896 objects.
      #
      # The fixture asserts BOTH directions, which is why this half needs no
      # deliberately-broken script: a no-op fails on the test bucket still
      # existing, and an over-broad pattern fails on the real bucket or its
      # object being gone. Both branches were red-verified by hand before
      # this step was written.
      - name: It removes test buckets and leaves the real one alone
        run: |
          node infra/test/buckets-fixture.mjs seed
          node infra/clean-test-buckets.mjs
          node infra/test/buckets-fixture.mjs assert

      # A second run must be a clean no-op. The script is the kind of thing
      # somebody pastes into a cron, and a non-zero exit on an already-clean
      # store would read as a real failure.
      - name: ...and is idempotent
        run: |
          node infra/clean-test-buckets.mjs
          node infra/test/buckets-fixture.mjs assert

      # THE THIRD RESIDUE: objects inside the REAL bucket whose run is gone.
      # Mostly `live/{runId}/` chunks that LiveChunkStore.finalize failed to
      # delete and explicitly left "for a lifecycle rule to reap" — there is
      # no lifecycle rule on the compose MinIO.
      #
      # `--min-age-hours 0` because every object the fixture writes is seconds
      # old, and the default 24h guard would exempt all of them — the step
      # would pass while deleting nothing. The guard gets its own step below.
      #
      # The fixture holds BOTH key shapes at once because they are keyed
      # differently — `live/{runId}/` by run, `runs/{projectId}/` by project,
      # with `run.bundle_key` the only exact keep-list. A rule that read the
      # second path segment as the run would keep an unreferenced bundle; one
      # that keyed `live/` off bundle_key would delete a live run's chunks.
      # Only a fixture carrying both can tell those two mistakes apart, and
      # both were red-verified by hand.
      - name: It removes orphaned objects and keeps live ones
        run: |
          node infra/test/orphans-fixture.mjs seed
          node infra/clean-orphaned-objects.mjs --delete --min-age-hours 0
          node infra/test/orphans-fixture.mjs assert

      # The age guard is what makes the database-snapshot race safe: a run
      # opened mid-sweep has no row yet, so its chunks look orphaned. Same
      # seed, default age, everything must survive.
      - name: ...the age guard exempts everything recent
        run: |
          node infra/test/orphans-fixture.mjs seed
          node infra/clean-orphaned-objects.mjs --delete
          node infra/test/orphans-fixture.mjs assert-guard

      # An empty run table classifies EVERY object as orphaned, and is far
      # more likely to be the wrong DATABASE_URL than a real empty instance.
      # It must refuse rather than compute the right answer to the wrong
      # question — and must still classify in a dry run.
      - name: ...and it refuses to delete against an empty run table
        run: |
          $PSQL -q -c "TRUNCATE org CASCADE"
          if node infra/clean-orphaned-objects.mjs --delete --min-age-hours 0; then
            echo "::error::the sweep deleted against an empty run table instead of refusing"
            exit 1
          fi
          node infra/clean-orphaned-objects.mjs --min-age-hours 0
          echo "refused with --delete, still classified in a dry run"

  # ═══ FIREFOX AND WEBKIT ═══
  #
  # `pnpm test:e2e` is Chromium-only and stays that way; see the comment on
  # `projects` in playwright.config.ts. This job runs the same 101 specs on
  # all three engines.
  #
  # NOT on every pull request. What it catches — CSS layout differences,
  # focus behaviour, `Intl` formatting, and this product's real exposure,
  # WebSocket and cookie handling under a strict CSP — does not change between
  # two commits on a feature branch, and tripling a ~13-minute gate on every
  # push buys nothing. On `main` and on demand is the cadence that matches.
  e2e-cross-browser:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perfportal
          POSTGRES_PASSWORD: perfportal
          POSTGRES_DB: perfportal
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U perfportal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      minio:
        # The same pinned digest the `build` job uses — see the long comment
        # there for why it is `bitnamilegacy` and why it is a digest.
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: perfportal
          MINIO_ROOT_PASSWORD: perfportal123
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://perfportal:perfportal@localhost:5433/perfportal
      REDIS_URL: redis://localhost:6380
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: perfportal
      S3_SECRET_KEY: perfportal123

    steps:
      - uses: actions/checkout@v4
      # No `version:` input: package.json's `packageManager` field pins it,
      # and pnpm/action-setup refuses both at once. One source of truth for
      # the pnpm the lockfile was written by — CI, the image and a
      # contributor's `corepack enable` all read the same field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @perfportal/persistence exec prisma generate --schema prisma/schema.prisma
      - run: pnpm --filter @perfportal/persistence exec prisma migrate deploy --schema prisma/schema.prisma
      # BEFORE Playwright collects specs. `apps/web/e2e/fixtures.ts` imports
      # the worker's COMPILED output (`../../worker/dist/...`) at module load,
      # so on a clean checkout the spec files cannot even be read until a
      # build has happened. playwright.config.ts's `webServer` command builds
      # too, but that starts after collection — the same ordering the `build`
      # job's comment above explains for typecheck.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e:cross

  # The Gatling Gradle plugin (clients/gatling-gradle) is a Kotlin/Gradle
  # module outside the pnpm workspace (pnpm-workspace.yaml globs only
  # packages/* and apps/*), so it gets its own job rather than a step bolted
  # onto `build`. It needs no Postgres, Redis or MinIO, so as its own job it
  # runs in parallel and a Gradle failure reports without waiting behind the
  # whole Node gate.
  #
  # `permissions` is scoped to this job only, not the workflow, because this
  # is the one job that needs to publish a package — `contents: read` is the
  # default already implied for every job, spelled out here only because
  # setting any key under `permissions` makes the whole map explicit.
  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/gatling-gradle
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew build --no-daemon
      - name: Publish snapshot to GitHub Packages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew publish --no-daemon

  # Proves the CONSUMER path against the real registry: a scratch project that
  # knows nothing but the plugin id resolves dev.vantrix.gatling from GitHub
  # Packages and applies it. The publish above proved artifacts go IN; nothing
  # proved they come back OUT until this job existed — and maven.pkg.github.com
  # rejects unauthenticated downloads even for public repos, so this is also
  # the standing demonstration of the credentials a consumer needs.
  #
  # On pull requests this resolves the LAST snapshot main published (the PR's
  # own build is not published), which is exactly the artifact a consumer
  # would get today. On main pushes, `needs: plugin` orders it after the fresh
  # publish so it exercises the snapshot that just landed.
  plugin-consume:
    runs-on: ubuntu-latest
    needs: plugin
    # MAIN PUSHES ONLY, deliberately. The registry round-trip is a
    # POST-publish property: on a PR the registry holds main's last snapshot,
    # which can differ from this branch in version and in guarantees — the
    # shading transition proved it, when the hardened classpath assertion
    # correctly failed every PR against the old unshaded snapshot it had no
    # way to replace. Here, `needs: plugin` means the snapshot under test is
    # the one this very run just published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve and apply the published plugin from GitHub Packages
        env:
          GH_PKG_USER: ${{ github.actor }}
          GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCRATCH="$RUNNER_TEMP/consume-check"
          mkdir -p "$SCRATCH"
          cat > "$SCRATCH/settings.gradle.kts" <<'KTS'
          pluginManagement {
              repositories {
                  maven {
                      url = uri("https://maven.pkg.github.com/Rabindra184/vantrix")
                      credentials {
                          username = System.getenv("GH_PKG_USER")
                          password = System.getenv("GH_PKG_TOKEN")
                      }
                  }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = "consume-check"
          KTS
          # The version under test is whatever THIS commit's build publishes —
          # read from the build, never pinned, so a version bump cannot leave
          # this job testing a stale artifact forever.
          VERSION=$(./clients/gatling-gradle/gradlew -p clients/gatling-gradle properties --no-daemon -q | awk '/^version:/{print $2}')
          echo "consume-check targeting version: $VERSION"
          cat > "$SCRATCH/build.gradle.kts" <<KTS
          plugins { id("dev.vantrix.gatling") version "$VERSION" }
          KTS
          ./clients/gatling-gradle/gradlew -p "$SCRATCH" tasks --all --no-daemon -q | tee /tmp/tasks.out
          grep -q "vantrixClose" /tmp/tasks.out             && echo "CONSUME CHECK PASSED: plugin resolved from the registry and applied"             || { echo "CONSUME CHECK FAILED: plugin did not resolve or did not apply"; exit 1; }
          # The shading guarantee, enforced where it matters -- on a CONSUMER's
          # buildscript classpath. The jar-content check inside the plugin's own
          # build cannot see this: a clean POM with live Gradle module metadata
          # still leaks dependencies to consumers, which is exactly how the
          # first shaded build failed (found by resolving as a real consumer;
          # the fix disables module metadata generation outright).
          ./clients/gatling-gradle/gradlew -p "$SCRATCH" buildEnvironment --no-daemon -q | tee /tmp/env.out
          if grep -qE "com.google.code.gson|org.apache.commons:commons-compress" /tmp/env.out; then
            echo "CONSUME CHECK FAILED: shaded dependencies leaked onto the consumer classpath"; exit 1
          fi
          echo "CONSUME CHECK PASSED: consumer classpath carries no shaded dependency"

