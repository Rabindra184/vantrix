name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perfportal
          POSTGRES_PASSWORD: perfportal
          POSTGRES_DB: perfportal
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U perfportal"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

      minio:
        # bitnami/minio is used (not minio/minio, the local-compose image)
        # because GitHub Actions service containers cannot override a
        # container's command, and minio/minio's entrypoint requires an
        # explicit `server /data` argument to start; bitnami's image starts
        # the server automatically from MINIO_ROOT_USER/PASSWORD alone.
        #
        # The `bitnami/*` Docker Hub org stopped publishing free images in
        # its August 2025 catalog change; `bitnami/minio:latest` no longer
        # resolves. Existing free-tier tags moved to `bitnamilegacy/minio`,
        # verified locally to pull, boot without a command, and pass this
        # same health check.
        #
        # Pinned by digest, not `:latest`: `bitnamilegacy` is itself a
        # deprecated/archival namespace (the whole reason it exists is that
        # `bitnami/minio:latest` vanished out from under CI once already), so
        # a second floating tag from the same namespace would repeat the
        # exact exposure this comment is here to explain. Resolved with
        # `docker pull bitnamilegacy/minio:latest && docker inspect
        # --format='{{index .RepoDigests 0}}' bitnamilegacy/minio:latest`
        # on 2026-08-08; bump this digest deliberately, not automatically,
        # the next time the image needs to change.
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: perfportal
          MINIO_ROOT_PASSWORD: perfportal123
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://perfportal:perfportal@localhost:5433/perfportal
      REDIS_URL: redis://localhost:6380
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: perfportal
      S3_SECRET_KEY: perfportal123

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # A dependency change is only validated from a clean install. The single
      # CI failure in this project's history was a removal verified against a
      # stale node_modules that still had the package hoisted.
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @perfportal/persistence exec prisma generate --schema prisma/schema.prisma
      - run: pnpm --filter @perfportal/persistence exec prisma migrate deploy --schema prisma/schema.prisma

      - run: pnpm lint
      # BEFORE typecheck, not after. apps/web/e2e/fixtures.ts imports the
      # worker's COMPILED output (../../worker/dist/...) — deliberately, so
      # Playwright's TS loader never has to re-transpile a Nest-decorated
      # class; see the comment at the top of that file. So `apps/web/e2e`
      # cannot be type-checked until apps/worker has been built.
      #
      # This never fails on a developer's machine, because dist/ is already
      # there from the last build. It fails only on a clean checkout, which
      # is exactly what CI is.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration

      # Chromium only — playwright.config.ts declares one project.
      - run: pnpm exec playwright install --with-deps chromium
      # AFTER test:integration, never beside it: createTestApp() TRUNCATEs
      # every table, and these two suites share one database.
      - run: pnpm test:e2e

  # The load-generator telemetry agent (agent/) is a Go module outside the
  # pnpm workspace (pnpm-workspace.yaml globs only packages/* and apps/*), so
  # it gets its own job rather than a step bolted onto `build`. It needs no
  # Postgres, Redis or MinIO, so as its own job it runs in parallel and a Go
  # failure reports in under a minute instead of behind the whole Node gate.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4
      # `go-version-file: agent/go.mod` rather than a literal: the `go`
      # directive in that file is the single source of truth for the toolchain,
      # exactly as .nvmrc is for Node. A literal here drifts silently.
      #
      # That directive reads `go 1.24.0`, not the bare `go 1.24` Task 1
      # shipped — Task 3's `go get github.com/shirou/gopsutil/v4` pulled in
      # v4.26.7, which itself declares `go 1.24.0`, and a module's directive
      # must be at least its dependencies'. `go 1.24` is therefore not
      # restorable; `go mod tidy` rewrites it back every time. The version is
      # no longer ours to choose. The `toolchain` directive `go get` also
      # wanted to add is deliberately absent, though — that would pin CI to
      # whichever patch release happened to be installed on the developer's
      # laptop the day the dependency was added, and every other developer's
      # `go mod tidy` would either silently download that exact patch or
      # churn the file back and forth against their own local toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - run: go vet ./...
      # footprint_test.go carries a `//go:build !race` tag, so it is not even
      # compiled into this run — see that file for why.
      - run: go test ./... -race
      # WITHOUT -race. The detector multiplies CPU by 5-10x, so a budget
      # measured under it is measuring the detector; the build tag above is
      # what makes this the only step that ever runs it.
      - run: go test -run TestFootprintBudget -v ./...

      # Cross-compiled for the platforms load generators actually run on
      # (spec §9). linux/amd64 and linux/arm64 at minimum; CGO_ENABLED=0 so the
      # result is a single static binary with no glibc floor, which is what
      # makes "copy it onto the box" a real distribution story.
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/perfportal-agent-linux-amd64 ./cmd/perfportal-agent
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/perfportal-agent-linux-arm64 ./cmd/perfportal-agent
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: perfportal-agent
          path: agent/dist/

  # The Gatling Gradle plugin (clients/gatling-gradle) is a Kotlin/Gradle
  # module outside the pnpm workspace (pnpm-workspace.yaml globs only
  # packages/* and apps/*), so it gets its own job rather than a step bolted
  # onto `build`. It needs no Postgres, Redis or MinIO, so as its own job it
  # runs in parallel and a Gradle failure reports without waiting behind the
  # whole Node gate.
  #
  # `permissions` is scoped to this job only, not the workflow, because this
  # is the one job that needs to publish a package — `contents: read` is the
  # default already implied for every job, spelled out here only because
  # setting any key under `permissions` makes the whole map explicit.
  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/gatling-gradle
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew build --no-daemon
      - name: Publish snapshot to GitHub Packages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew publish --no-daemon

  # Proves the CONSUMER path against the real registry: a scratch project that
  # knows nothing but the plugin id resolves dev.vantrix.gatling from GitHub
  # Packages and applies it. The publish above proved artifacts go IN; nothing
  # proved they come back OUT until this job existed — and maven.pkg.github.com
  # rejects unauthenticated downloads even for public repos, so this is also
  # the standing demonstration of the credentials a consumer needs.
  #
  # On pull requests this resolves the LAST snapshot main published (the PR's
  # own build is not published), which is exactly the artifact a consumer
  # would get today. On main pushes, `needs: plugin` orders it after the fresh
  # publish so it exercises the snapshot that just landed.
  plugin-consume:
    runs-on: ubuntu-latest
    needs: plugin
    # MAIN PUSHES ONLY, deliberately. The registry round-trip is a
    # POST-publish property: on a PR the registry holds main's last snapshot,
    # which can differ from this branch in version and in guarantees — the
    # shading transition proved it, when the hardened classpath assertion
    # correctly failed every PR against the old unshaded snapshot it had no
    # way to replace. Here, `needs: plugin` means the snapshot under test is
    # the one this very run just published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve and apply the published plugin from GitHub Packages
        env:
          GH_PKG_USER: ${{ github.actor }}
          GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCRATCH="$RUNNER_TEMP/consume-check"
          mkdir -p "$SCRATCH"
          cat > "$SCRATCH/settings.gradle.kts" <<'KTS'
          pluginManagement {
              repositories {
                  maven {
                      url = uri("https://maven.pkg.github.com/Rabindra184/vantrix")
                      credentials {
                          username = System.getenv("GH_PKG_USER")
                          password = System.getenv("GH_PKG_TOKEN")
                      }
                  }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = "consume-check"
          KTS
          # The version under test is whatever THIS commit's build publishes —
          # read from the build, never pinned, so a version bump cannot leave
          # this job testing a stale artifact forever.
          VERSION=$(./clients/gatling-gradle/gradlew -p clients/gatling-gradle properties --no-daemon -q | awk '/^version:/{print $2}')
          echo "consume-check targeting version: $VERSION"
          cat > "$SCRATCH/build.gradle.kts" <<KTS
          plugins { id("dev.vantrix.gatling") version "$VERSION" }
          KTS
          ./clients/gatling-gradle/gradlew -p "$SCRATCH" tasks --all --no-daemon -q | tee /tmp/tasks.out
          grep -q "vantrixClose" /tmp/tasks.out             && echo "CONSUME CHECK PASSED: plugin resolved from the registry and applied"             || { echo "CONSUME CHECK FAILED: plugin did not resolve or did not apply"; exit 1; }
          # The shading guarantee, enforced where it matters -- on a CONSUMER's
          # buildscript classpath. The jar-content check inside the plugin's own
          # build cannot see this: a clean POM with live Gradle module metadata
          # still leaks dependencies to consumers, which is exactly how the
          # first shaded build failed (found by resolving as a real consumer;
          # the fix disables module metadata generation outright).
          ./clients/gatling-gradle/gradlew -p "$SCRATCH" buildEnvironment --no-daemon -q | tee /tmp/env.out
          if grep -qE "com.google.code.gson|org.apache.commons:commons-compress" /tmp/env.out; then
            echo "CONSUME CHECK FAILED: shaded dependencies leaked onto the consumer classpath"; exit 1
          fi
          echo "CONSUME CHECK PASSED: consumer classpath carries no shaded dependency"

